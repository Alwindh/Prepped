name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Check syntax
        run: luac5.1 -p *.lua tests/*.lua

      - name: Run tests
        run: lua5.1 tests/run.lua

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check

      # Accidental globals and misspelled game API names (see .luacheckrc)
      - name: Run luacheck
        run: luacheck --version && luacheck .

  # Every pull request that changes the addon ships as a release (CLAUDE.md):
  # it must bump "## Version:" in prepped.toc, to a version without a release tag.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the version bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          # Addon files are the .lua and .toc files at the top level (not tests/)
          if ! git diff --name-only "origin/$BASE_REF...HEAD" | grep -Eq '^[^/]+\.(lua|toc)$'; then
            echo "No addon files changed; no version bump needed."
            exit 0
          fi
          version() { grep '^## Version:' | sed 's/^## Version:[[:space:]]*//' | tr -d '\r'; }
          new=$(version < prepped.toc)
          old=$(git show "origin/$BASE_REF:prepped.toc" | version)
          if [ -z "$new" ]; then
            echo "::error file=prepped.toc::No '## Version:' line in prepped.toc."
            exit 1
          fi
          if [ "$new" = "$old" ]; then
            echo "::error file=prepped.toc::The addon changed but '## Version:' is still $old. Bump it: patch for fixes, minor for features, major for breaking changes."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
            echo "::error file=prepped.toc::Version $new is lower than $old on $BASE_REF."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$new-release" > /dev/null; then
            echo "::error file=prepped.toc::A release tag v$new-release already exists. Pick a new version."
            exit 1
          fi
          echo "Version $old -> $new; release tag v$new-release is free."
